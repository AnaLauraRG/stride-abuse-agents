# Infraestructura local del Reto 2: n8n (orquestación) y Ollama (embeddings).
# Supabase y la API de Claude son servicios en la nube y no forman parte de este archivo.
#
# Uso (desde esta carpeta):
#   cp .env.example .env      # y completar N8N_ENCRYPTION_KEY
#   docker compose up -d
#   docker compose exec ollama ollama pull bge-m3
#
# n8n queda en http://localhost:5678, solo accesible desde la propia VM.
# Ollama no publica puertos: n8n lo alcanza por la red interna en http://ollama:11434.

services:
  ollama:
    image: docker.io/ollama/ollama:0.40.17
    restart: unless-stopped
    environment:
      # Un solo modelo cargado y una petición a la vez: la VM tiene 6 GB de RAM.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Descarga el modelo de la RAM tras 10 minutos sin uso.
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  n8n:
    image: ghcr.io/n8n-io/n8n:2.48.6  # GitHub Container Registry: evita el límite de descargas anónimas de Docker Hub
    restart: unless-stopped
    ports:
      # Solo la interfaz local: n8n no queda expuesto a la red.
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en infra/.env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Mexico_City}
      TZ: ${TIMEZONE:-America/Mexico_City}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Los nodos de archivos solo pueden leer /files (ahí se monta data/ del repositorio).
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      # Sin telemetría ni encuestas.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Fuentes de datos del repositorio, solo lectura (WF-1 las lee de aquí).
      - ../data:/files/data:ro
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  n8n_data:
  ollama_data:
